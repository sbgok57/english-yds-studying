# ============================================================
# CI — her PR'da derleme kontrolü; kırık kod merge edilmesin
# ============================================================
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü + build
        run: npm run build
        env:
          # Build için gerekli dummy değerler (gerçekleri Vercel integration basar)
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder
          NEXT_PUBLIC_AUDIO_BASE_URL: /audio
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
