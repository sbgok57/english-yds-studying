# ============================================================
# Supabase Deploy — main'e her push'ta migration'ları uygular
# Gereken GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  (Supabase dashboard → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   (Project → Database → Settings)
# ============================================================
name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: # manuel tetikleme

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supabase CLI kur
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migration'ları lintle
        run: supabase db lint

      - name: Migration'ları uygula (db push)
        run: supabase db push --linked
