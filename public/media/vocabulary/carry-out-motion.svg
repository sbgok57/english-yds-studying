<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" rx="20" fill="#0f172a"/>
  <text x="36" y="36" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">PHRASAL VERB MOTION · CARRY OUT (YÜRÜTMEK / UYGULAMAK)</text>
  <!-- Step 1: Plan -->
  <rect x="36" y="75" width="90" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="81" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">1. PLAN</text>
  <text x="81" y="138" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Hypothesis</text>
  <!-- Step 2: Execute -->
  <rect x="155" y="75" width="90" height="110" rx="12" fill="#0f766e" fill-opacity="0.35" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="200" y="115" text-anchor="middle" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold">2. EXECUTE</text>
  <text x="200" y="138" text-anchor="middle" fill="#99f6e4" font-family="sans-serif" font-size="10">Carry Out</text>
  <!-- Step 3: Result -->
  <rect x="274" y="75" width="90" height="110" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="319" y="115" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="13" font-weight="bold">3. RESULT</text>
  <text x="319" y="138" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="10">Completed ✓</text>
  <!-- Animated Flow Pulse -->
  <circle cx="81" cy="162" r="6" fill="#22d3ee">
    <animate attributeName="cx" values="81;200;319;81" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
